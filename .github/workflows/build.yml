name: build

on:
  push:
    paths:
      - "sudont.cr"
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.libc }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: glibc
            runner: ubuntu-latest

          - arch: x86_64
            libc: musl
            runner: ubuntu-latest

          - arch: aarch64
            libc: glibc
            runner: ubuntu-24.04-arm

          - arch: aarch64
            libc: musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install glibc static dependencies
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgc-dev \
            libevent-dev \
            libpcre2-dev \
            pkg-config \
            gcc \
            binutils

      - name: Build glibc statically
        if: matrix.libc == 'glibc'
        run: |
          crystal --version

          crystal build src/sudont.cr \
            --release \
            -O3 \
            --static \
            -o sudont-${{ matrix.arch }}-glibc

      - name: Build musl statically
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            crystallang/crystal:latest-alpine \
            sh -lc '
              apk add --no-cache \
                gc-static \
                gcc \
                musl-dev \
                binutils

              crystal --version

              crystal build src/sudont.cr \
                --release \
                -O3 \
                --static \
                -o sudont-${{ matrix.arch }}-musl
            '

      - name: Verify executable
        run: |
          set -eu

          BIN="sudont-${{ matrix.arch }}-${{ matrix.libc }}"

          test -x "$BIN"
          file "$BIN"

          if readelf -l "$BIN" | grep -q INTERP; then
            echo "ERROR: executable still has a dynamic interpreter"
            exit 1
          fi

          echo "ELF interpreter not found."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudont-${{ matrix.arch }}-${{ matrix.libc }}
          path: sudont-${{ matrix.arch }}-${{ matrix.libc }}
          if-no-files-found: error

  put-release:
    name: Update latest-sudont
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Prepare release assets
        run: |
          set -eu

          mkdir -p release

          find dist -type f -exec cp {} release/ \;

          echo "Release assets:"
          ls -lh release/

      - name: Update latest-sudont
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          if gh release view latest-sudont \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release upload latest-sudont release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create latest-sudont release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "latest-sudont" \
              --notes "Builds estáticos do sudont."
          fi