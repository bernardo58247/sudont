name: build

on:
  workflow_dispatch:

jobs:
  build:
     runs-on: ubuntu-latest
       
       steps: 
          - name: download code
            uses: actions/checkout@v1
           
          - name: install crystal
            uses: crystal-lang/install-crystal@v1
            with: 
               crystal: latest
        
          - name: compile
            run: |
              crystal build src/sudont.cr --release -O3