name: build

on:
  push:
    paths:
      - "sudont.cr"
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.libc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: glibc
            runner: ubuntu-latest
          - arch: x86_64
            libc: musl
            runner: ubuntu-latest
          - arch: aarch64
            libc: glibc
            runner: ubuntu-24.04-arm
          - arch: aarch64
            libc: musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Crystal
        if: matrix.libc == 'glibc'
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Build glibc
        if: matrix.libc == 'glibc'
        run: |
          crystal build src/sudont.cr \
            --release \
            -O3 \
            -o sudont-${{ matrix.arch }}-glibc

      - name: Build musl
        if: matrix.libc == 'musl'
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            crystallang/crystal:latest-alpine \
            crystal build src/sudont.cr \
              --release \
              -O3 \
              --static \
              -o sudont-${{ matrix.arch }}-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudont-${{ matrix.arch }}-${{ matrix.libc }}
          path: sudont-${{ matrix.arch }}-${{ matrix.libc }}

  put-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Update latest-sudont
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-sudont \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-sudont release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create latest-sudont release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "latest-sudont" \
              --notes "Builds automáticos do sudont."
          fi